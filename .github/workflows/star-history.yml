name: Update Star History

on:
  workflow_dispatch:
  schedule:
    - cron: "23 1 * * *" # Every day at 01:23 UTC

permissions:
  contents: write

concurrency:
  group: star-history
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build SVG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/generate_star_history.py

      - name: Commit SVG if changed
        run: |
          if git diff --quiet -- assets/star-history.svg && git ls-files --error-unmatch assets/star-history.svg >/dev/null 2>&1; then
            echo "SVG has not changed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/star-history.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: update Star History chart"
            git push
          fi
